version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: /bin/sh -c "while sleep 1000; do :; done"
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ../:/workspace:cached
    environment:
      - DATABASE_URL=postgresql://govuser:govpassword@db:5432/govdata
      - NODE_ENV=development
    networks:
      - dev_network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: govuser
      POSTGRES_PASSWORD: govpassword
      POSTGRES_DB: govdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dev_network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govuser -d govdata"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  dev_network:
    driver: bridge
